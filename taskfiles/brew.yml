# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: 3

silent: true

tasks:
  sync:
    desc: Synchronize homebrew packages
    summary: |
      Updates Homebrew packages

      If Brewfile.personal exists, uses it instead of the main Brewfile.
      Also installs packages from Brewfile.local if present.
    platforms: ['darwin']
    cmds:
      - |
        if [ -f Brewfile.personal ]; then
          echo "Using Brewfile.personal..."
          brew bundle --file=Brewfile.personal
        else
          brew bundle
        fi
      - |
        if [ -f Brewfile.local ]; then
          echo "Installing packages from Brewfile.local..."
          brew bundle --file=Brewfile.local
        fi
